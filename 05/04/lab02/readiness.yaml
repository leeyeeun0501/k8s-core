apiVersion: v1
kind: Pod
metadata:
  name: readiness
  namespace: lab02
spec:
  containers:
  - name: nginx
    image: nginx:1.30
    ports:
    - containerPort: 80
    readinessProbe:
      httpGet:
        path: /ready.html
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 1
      successThreshold: 1
      failureThreshold: 3