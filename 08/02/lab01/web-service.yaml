apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lab01
  annotations:
    # service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
# type: ClusterIP
# type: NodePort
  type: LoadBalancer
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 80