apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab03
spec:
  replicas: 10

  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: nginx
        image: nginx:1.29
        command: ["sh", "-c", "sleep 10; exec nginx -g 'daemon off;'"]
        ports:
        - containerPort: 80
        
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 2
          successThreshold: 1
          failureThreshold: 3