apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: gallery
spec:
  replicas: 1

  selector:
    matchLabels:
      tier: db
  
  template:
    metadata:
      namespace: gallery
      labels:
        tier: db
    spec:
      containers:
      - name: mariadb
        image: mariadb:11.8
        ports:
        - containerPort: 3306
        env:
        - name: MARIADB_ROOT_PASSWORD
          value: "root1234"
        - name: MARIADB_DATABASE
          value: "gallery"
        - name: MARIADB_USER
          value: "gallery"
        - name: MARIADB_PASSWORD
          value: "gallery"
        readinessProbe:
          exec:
            command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          initialDelaySeconds: 5
          timeoutSeconds: 3
          periodSeconds: 5
          successThreshold: 1
          failureThreshold: 3